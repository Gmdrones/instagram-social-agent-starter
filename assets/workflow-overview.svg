<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Instagram Social Agent workflow</title><desc id="d">Independent workflow: configure audience, research public profiles, deduplicate in local CRM, prepare message drafts, review and report.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10112f"/><stop offset="1" stop-color="#2a1855"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#765bff"/><stop offset="1" stop-color="#df57c5"/></linearGradient></defs><rect width="1200" height="500" rx="26" fill="url(#bg)"/><circle cx="1120" cy="10" r="240" fill="#6e49e1" opacity=".12"/><circle cx="40" cy="490" r="190" fill="#d658b4" opacity=".12"/><rect x="56" y="58" width="162" height="33" rx="16" fill="#483ca0"/><text x="137" y="80" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#eee9ff">OPEN SOURCE</text><text x="56" y="153" font-family="Arial,sans-serif" font-size="51" font-weight="bold" fill="#ffffff">Instagram Social Agent</text><text x="58" y="195" font-family="Arial,sans-serif" font-size="23" fill="#bbb6e2">Seu nicho. Seus dados. Seu ambiente.</text><path d="M90 316 H1108" stroke="url(#accent)" stroke-width="5" opacity=".7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="white"><g transform="translate(66 261)"><rect width="197" height="114" rx="17" fill="#2c2864" stroke="#6b5bca"/><text x="98" y="36" font-size="26">01</text><text x="98" y="69" font-size="19" font-weight="bold">Defina o nicho</text><text x="98" y="94" font-size="14" fill="#d6d0fa">Tema e região</text></g><g transform="translate(283 261)"><rect width="197" height="114" rx="17" fill="#2c2864" stroke="#6b5bca"/><text x="98" y="36" font-size="26">02</text><text x="98" y="69" font-size="19" font-weight="bold">Descubra perfis</text><text x="98" y="94" font-size="14" fill="#d6d0fa">Pesquisa pública</text></g><g transform="translate(500 261)"><rect width="197" height="114" rx="17" fill="#2c2864" stroke="#6b5bca"/><text x="98" y="36" font-size="26">03</text><text x="98" y="69" font-size="19" font-weight="bold">Organize o CRM</text><text x="98" y="94" font-size="14" fill="#d6d0fa">SQLite local</text></g><g transform="translate(717 261)"><rect width="197" height="114" rx="17" fill="#2c2864" stroke="#6b5bca"/><text x="98" y="36" font-size="26">04</text><text x="98" y="69" font-size="19" font-weight="bold">Prepare mensagens</text><text x="98" y="94" font-size="14" fill="#d6d0fa">Rascunhos</text></g><g transform="translate(934 261)"><rect width="197" height="114" rx="17" fill="#2c2864" stroke="#6b5bca"/><text x="98" y="36" font-size="26">05</text><text x="98" y="69" font-size="19" font-weight="bold">Revise e acompanhe</text><text x="98" y="94" font-size="14" fill="#d6d0fa">Relatórios</text></g></g><text x="58" y="445" font-family="Arial,sans-serif" font-size="16" fill="#b7b1df">Fluxo ilustrativo das funções públicas • Não representa envio automático de Directs frios</text></svg>